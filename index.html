<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lyra's Cadence - Retro Rhythm Adventure</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#121318">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <div id="game-container">
    <!-- Retro Console Screen Frame -->
    <div id="screen-bezel">
      <div id="stage-sidebar">
        <span id="stage-label">Introduction</span>
      </div>

      <div id="canvas-wrapper">
        <canvas id="gameCanvas" width="320" height="180"></canvas>
        
        <!-- CRT scanline overlay -->
        <div id="crt-overlay"></div>
        
        <!-- Start Audio Overlay (Browser audio policy) -->
        <div id="start-overlay" class="overlay-modal">
          <div class="modal-content">
            <h1 class="pixel-title">LYRA'S CADENCE</h1>
            <p class="subtitle">A Retro Rhythm Adventure</p>
            <div class="instructions">
              <p>🎵 Move & Attack on the <strong>Beat</strong> to build Combo!</p>
              <p>⌨️ Controls: <strong>Arrow Keys / WASD</strong> to Move</p>
              <p>⚔️ <strong>Space / Z</strong> to Attack / Interact</p>
              <p>💬 <strong>Enter / Space</strong> to advance Dialog</p>
            </div>
            <button id="btn-start" class="retro-btn">START GAME</button>
          </div>
        </div>

        <!-- Mobile Touch Controls -->
        <div id="touch-controls">
          <div id="dpad">
            <button class="dpad-btn up" data-key="ArrowUp">▲</button>
            <button class="dpad-btn left" data-key="ArrowLeft">◀</button>
            <button class="dpad-btn center"></button>
            <button class="dpad-btn right" data-key="ArrowRight">▶</button>
            <button class="dpad-btn down" data-key="ArrowDown">▼</button>
          </div>
          <div id="action-buttons">
            <button class="act-btn btn-b" data-key="KeyZ">ATK (Z)</button>
            <button class="act-btn btn-a" data-key="Space">ACT (Space)</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Retro Bottom Control Bar -->
    <div id="controls-bar">
      <div class="control-item">
        <button id="btn-mute" class="retro-icon-btn" title="Toggle Sound (M)">🔊 Sound: On</button>
        <button id="btn-crt" class="retro-icon-btn" title="Toggle CRT Filter">📺 CRT: On</button>
        <button id="btn-touch" class="retro-icon-btn" title="Toggle Touch Pad">📱 Touch Pad</button>
        <button id="btn-debug" class="retro-icon-btn" title="Toggle Debug FPS">🛠️ FPS: On</button>
        <button id="btn-restart" class="retro-icon-btn" title="Restart Stage (R)">🔄 Restart</button>
        <a class="retro-icon-btn repo-link" href="https://github.com/jeiel85/lyra-cadence-rhythm-game" target="_blank" rel="noopener noreferrer" aria-label="View source code on GitHub (opens in a new tab)"><svg viewBox="0 0 16 16" width="10" height="10" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg> GitHub</a>
      </div>
      <div class="info-text">
        Inspired by @partnano's "Slowly a game" | 4 Stages &amp; Boss Fight
      </div>
    </div>
  </div>

  <script src="js/audio.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/stages.js"></script>
  <script src="js/boss.js"></script>
  <script src="js/input.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((err) => console.warn('Service worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
